<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" shape-rendering="crispEdges">
  <!--
    Pixel gecko on the left eating bugs that fly in from the right.
    GameBoy palette:
      darkest  #0f380f
      dark     #306230
      light    #8bac0f
      lightest #9bbc0f
    Each "pixel" is 4x4 user units.
    Loop length: 4s.
    Timeline:
      0.0s - 1.6s : bug walks in from right (x: 400 -> 150)
      1.6s - 2.0s : tongue extends from gecko mouth out to bug (length 0 -> ~85)
      2.0s - 2.2s : bug hidden, tongue retracts
      2.2s - 4.0s : pause, next bug spawns and loop restarts
  -->

  <!-- Optional background tint; keep transparent so it looks good on dark/light GitHub -->
  <rect width="400" height="100" fill="#9bbc0f" opacity="0"/>

  <!-- =========================================================
       GROUND (pixel strip)
       ========================================================= -->
  <g fill="#306230">
    <rect x="0"   y="84" width="400" height="4"/>
  </g>
  <g fill="#0f380f">
    <rect x="0"   y="88" width="400" height="4"/>
  </g>
  <!-- ground texture dots -->
  <g fill="#8bac0f">
    <rect x="20"  y="84" width="4" height="4"/>
    <rect x="72"  y="84" width="4" height="4"/>
    <rect x="140" y="84" width="4" height="4"/>
    <rect x="208" y="84" width="4" height="4"/>
    <rect x="276" y="84" width="4" height="4"/>
    <rect x="344" y="84" width="4" height="4"/>
  </g>

  <!-- =========================================================
       GECKO (pixel art, sitting on the ground, facing right)
       Anchored around x=20..104, y=44..84
       Mouth tip at roughly (104, 64)
       ========================================================= -->
  <g>
    <!-- Body outline (dark) -->
    <g fill="#0f380f">
      <!-- tail -->
      <rect x="8"  y="72" width="4" height="4"/>
      <rect x="12" y="68" width="4" height="4"/>
      <rect x="16" y="68" width="4" height="4"/>
      <rect x="20" y="68" width="4" height="4"/>
      <!-- back -->
      <rect x="24" y="64" width="4" height="4"/>
      <rect x="28" y="60" width="4" height="4"/>
      <rect x="32" y="56" width="4" height="4"/>
      <rect x="36" y="56" width="4" height="4"/>
      <rect x="40" y="56" width="4" height="4"/>
      <rect x="44" y="56" width="4" height="4"/>
      <rect x="48" y="56" width="4" height="4"/>
      <rect x="52" y="56" width="4" height="4"/>
      <rect x="56" y="56" width="4" height="4"/>
      <rect x="60" y="52" width="4" height="4"/>
      <rect x="64" y="52" width="4" height="4"/>
      <rect x="68" y="52" width="4" height="4"/>
      <rect x="72" y="52" width="4" height="4"/>
      <!-- head top -->
      <rect x="76" y="52" width="4" height="4"/>
      <rect x="80" y="48" width="4" height="4"/>
      <rect x="84" y="48" width="4" height="4"/>
      <rect x="88" y="48" width="4" height="4"/>
      <rect x="92" y="48" width="4" height="4"/>
      <rect x="96" y="52" width="4" height="4"/>
      <rect x="100" y="56" width="4" height="4"/>
      <!-- head front / snout -->
      <rect x="100" y="60" width="4" height="4"/>
      <rect x="104" y="60" width="4" height="4"/>
      <rect x="104" y="64" width="4" height="4"/>
      <!-- jaw line -->
      <rect x="100" y="68" width="4" height="4"/>
      <rect x="96"  y="68" width="4" height="4"/>
      <!-- belly underline -->
      <rect x="24" y="76" width="4" height="4"/>
      <rect x="28" y="76" width="4" height="4"/>
      <rect x="32" y="76" width="4" height="4"/>
      <rect x="36" y="76" width="4" height="4"/>
      <rect x="40" y="76" width="4" height="4"/>
      <rect x="44" y="76" width="4" height="4"/>
      <rect x="48" y="76" width="4" height="4"/>
      <rect x="52" y="76" width="4" height="4"/>
      <rect x="56" y="76" width="4" height="4"/>
      <rect x="60" y="76" width="4" height="4"/>
      <rect x="64" y="76" width="4" height="4"/>
      <rect x="68" y="76" width="4" height="4"/>
      <rect x="72" y="76" width="4" height="4"/>
      <rect x="76" y="76" width="4" height="4"/>
      <rect x="80" y="76" width="4" height="4"/>
      <rect x="84" y="76" width="4" height="4"/>
      <rect x="88" y="72" width="4" height="4"/>
      <rect x="92" y="72" width="4" height="4"/>
    </g>

    <!-- Body fill mid green -->
    <g fill="#306230">
      <!-- main body -->
      <rect x="24" y="68" width="4" height="4"/>
      <rect x="28" y="64" width="4" height="4"/>
      <rect x="32" y="60" width="4" height="4"/>
      <rect x="36" y="60" width="4" height="4"/>
      <rect x="40" y="60" width="4" height="4"/>
      <rect x="44" y="60" width="4" height="4"/>
      <rect x="48" y="60" width="4" height="4"/>
      <rect x="52" y="60" width="4" height="4"/>
      <rect x="56" y="60" width="4" height="4"/>
      <rect x="60" y="56" width="4" height="4"/>
      <rect x="64" y="56" width="4" height="4"/>
      <rect x="68" y="56" width="4" height="4"/>
      <rect x="72" y="56" width="4" height="4"/>
      <rect x="76" y="56" width="4" height="4"/>
      <rect x="80" y="52" width="4" height="4"/>
      <rect x="84" y="52" width="4" height="4"/>
      <rect x="88" y="52" width="4" height="4"/>
      <rect x="92" y="52" width="4" height="4"/>
      <rect x="96" y="56" width="4" height="4"/>
      <rect x="100" y="64" width="4" height="4"/>
      <rect x="96" y="64" width="4" height="4"/>
      <!-- belly fill -->
      <rect x="32" y="64" width="4" height="4"/>
      <rect x="36" y="64" width="4" height="4"/>
      <rect x="40" y="64" width="4" height="4"/>
      <rect x="44" y="64" width="4" height="4"/>
      <rect x="48" y="64" width="4" height="4"/>
      <rect x="52" y="64" width="4" height="4"/>
      <rect x="56" y="64" width="4" height="4"/>
      <rect x="60" y="60" width="4" height="4"/>
      <rect x="64" y="60" width="4" height="4"/>
      <rect x="68" y="60" width="4" height="4"/>
      <rect x="72" y="60" width="4" height="4"/>
      <rect x="76" y="60" width="4" height="4"/>
      <rect x="80" y="56" width="4" height="4"/>
      <rect x="84" y="56" width="4" height="4"/>
      <rect x="88" y="56" width="4" height="4"/>
      <rect x="92" y="56" width="4" height="4"/>
      <!-- lower belly -->
      <rect x="28" y="68" width="4" height="4"/>
      <rect x="32" y="68" width="4" height="4"/>
      <rect x="36" y="68" width="4" height="4"/>
      <rect x="40" y="68" width="4" height="4"/>
      <rect x="44" y="68" width="4" height="4"/>
      <rect x="48" y="68" width="4" height="4"/>
      <rect x="52" y="68" width="4" height="4"/>
      <rect x="56" y="68" width="4" height="4"/>
      <rect x="60" y="68" width="4" height="4"/>
      <rect x="64" y="68" width="4" height="4"/>
      <rect x="68" y="68" width="4" height="4"/>
      <rect x="72" y="68" width="4" height="4"/>
      <rect x="76" y="68" width="4" height="4"/>
      <rect x="80" y="68" width="4" height="4"/>
      <rect x="84" y="68" width="4" height="4"/>
      <rect x="88" y="68" width="4" height="4"/>
      <rect x="92" y="68" width="4" height="4"/>
      <rect x="28" y="72" width="4" height="4"/>
      <rect x="32" y="72" width="4" height="4"/>
      <rect x="36" y="72" width="4" height="4"/>
      <rect x="40" y="72" width="4" height="4"/>
      <rect x="44" y="72" width="4" height="4"/>
      <rect x="48" y="72" width="4" height="4"/>
      <rect x="52" y="72" width="4" height="4"/>
      <rect x="56" y="72" width="4" height="4"/>
      <rect x="60" y="72" width="4" height="4"/>
      <rect x="64" y="72" width="4" height="4"/>
      <rect x="68" y="72" width="4" height="4"/>
      <rect x="72" y="72" width="4" height="4"/>
      <rect x="76" y="72" width="4" height="4"/>
      <rect x="80" y="72" width="4" height="4"/>
      <rect x="84" y="72" width="4" height="4"/>
    </g>

    <!-- Highlight (light green) on top of head/back -->
    <g fill="#8bac0f">
      <rect x="84" y="52" width="4" height="4"/>
      <rect x="88" y="52" width="4" height="4"/>
      <rect x="68" y="56" width="4" height="4"/>
      <rect x="40" y="60" width="4" height="4"/>
      <rect x="44" y="60" width="4" height="4"/>
    </g>

    <!-- Eye -->
    <rect x="88" y="56" width="4" height="4" fill="#0f380f"/>
    <rect x="92" y="56" width="4" height="4" fill="#9bbc0f"/>
    <rect x="92" y="56" width="2" height="2" fill="#0f380f"/>

    <!-- Legs -->
    <g fill="#0f380f">
      <rect x="36" y="80" width="4" height="4"/>
      <rect x="40" y="80" width="4" height="4"/>
      <rect x="76" y="80" width="4" height="4"/>
      <rect x="80" y="80" width="4" height="4"/>
    </g>

    <!-- Mouth gap (animated open/close on chomp) -->
    <rect id="mouth" x="100" y="64" width="8" height="4" fill="#0f380f">
      <!-- Mouth opens briefly when tongue retracts (around 2.0s) -->
      <animate attributeName="height"
               values="4;4;4;8;4;4"
               keyTimes="0;0.4;0.5;0.52;0.6;1"
               dur="4s"
               repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- =========================================================
       TONGUE
       Shoots from mouth tip (~108, 64) out toward bug at ~150.
       Width animates from 0 -> ~45 then back to 0.
       ========================================================= -->
  <rect x="108" y="64" width="0" height="4" fill="#e83b3b">
    <animate attributeName="width"
             values="0;0;0;0;45;45;0;0"
             keyTimes="0;0.35;0.39;0.4;0.5;0.52;0.55;1"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>
  <!-- tongue tip (slightly darker red blob) -->
  <rect x="0" y="64" width="4" height="4" fill="#a91e1e" opacity="0">
    <animate attributeName="x"
             values="108;108;108;108;153;153;108;108"
             keyTimes="0;0.35;0.39;0.4;0.5;0.52;0.55;1"
             dur="4s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="0;0;0;1;1;1;0;0"
             keyTimes="0;0.35;0.39;0.4;0.5;0.52;0.55;1"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>

  <!-- =========================================================
       BUG (pixel beetle/fly) walking in from the right
       Travels from x=380 -> x=150 over the first ~50% of timeline,
       then disappears (eaten).
       ========================================================= -->
  <g>
    <g id="bug">
      <!-- body -->
      <rect x="0" y="68" width="4" height="4" fill="#0f380f"/>
      <rect x="4" y="68" width="4" height="4" fill="#0f380f"/>
      <rect x="8" y="68" width="4" height="4" fill="#0f380f"/>
      <rect x="0" y="64" width="4" height="4" fill="#306230"/>
      <rect x="4" y="64" width="4" height="4" fill="#306230"/>
      <rect x="8" y="64" width="4" height="4" fill="#306230"/>
      <!-- head -->
      <rect x="-4" y="68" width="4" height="4" fill="#0f380f"/>
      <!-- antennae -->
      <rect x="-4" y="60" width="2" height="4" fill="#0f380f"/>
      <rect x="-8" y="56" width="2" height="4" fill="#0f380f"/>
      <!-- wing highlight -->
      <rect x="4" y="64" width="2" height="2" fill="#8bac0f"/>
      <!-- legs (tiny) -->
      <rect x="0" y="72" width="2" height="2" fill="#0f380f"/>
      <rect x="6" y="72" width="2" height="2" fill="#0f380f"/>
      <rect x="10" y="72" width="2" height="2" fill="#0f380f"/>
    </g>
    <!-- Position + visibility animation on the whole bug group -->
    <animateTransform xlink:href="#bug"
                      attributeName="transform"
                      type="translate"
                      values="380,0; 150,0; 150,0; 150,0; 380,0"
                      keyTimes="0;0.4;0.5;0.55;1"
                      dur="4s"
                      repeatCount="indefinite"/>
    <animate xlink:href="#bug"
             attributeName="opacity"
             values="1;1;1;0;0;1"
             keyTimes="0;0.4;0.5;0.52;0.95;1"
             dur="4s"
             repeatCount="indefinite"/>
    <!-- subtle bobbing while walking -->
    <animateTransform xlink:href="#bug"
                      attributeName="transform"
                      type="translate"
                      additive="sum"
                      values="0,0; 0,-1; 0,0; 0,-1; 0,0"
                      keyTimes="0;0.1;0.2;0.3;0.4"
                      dur="0.4s"
                      repeatCount="indefinite"/>
  </g>
</svg>
