<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" shape-rendering="crispEdges">
  <style>
    /* 4s loop, CSS keyframes (camo-safe, same technique as readme-typing-svg) */

    /* Bug walks in from right, gets eaten at 50%, hidden until loop restarts */
    .bug {
      animation: bug-walk 4s infinite steps(1);
    }
    @keyframes bug-walk {
      0%   { transform: translate(380px, 0); }
      5%   { transform: translate(365px, -1px); }
      10%  { transform: translate(350px, 0); }
      15%  { transform: translate(330px, -1px); }
      20%  { transform: translate(310px, 0); }
      25%  { transform: translate(285px, -1px); }
      30%  { transform: translate(255px, 0); }
      35%  { transform: translate(220px, -1px); }
      40%  { transform: translate(185px, 0); }
      45%  { transform: translate(160px, -1px); }
      48%  { transform: translate(150px, 0); opacity: 1; }
      50%  { transform: translate(150px, 0); opacity: 0; }
      100% { transform: translate(150px, 0); opacity: 0; }
    }

    /* Tongue extends from mouth to bug, then retracts */
    .tongue {
      animation: tongue 4s infinite;
      transform-origin: 108px 66px;
    }
    @keyframes tongue {
      0%, 40%   { transform: scaleX(0); }
      45%       { transform: scaleX(0.5); }
      48%       { transform: scaleX(1); }
      50%       { transform: scaleX(1); }
      52%       { transform: scaleX(0.4); }
      55%, 100% { transform: scaleX(0); }
    }

    /* Tongue tip blob travels along with tongue end */
    .tongue-tip {
      animation: tongue-tip 4s infinite;
    }
    @keyframes tongue-tip {
      0%, 40%   { transform: translate(0, 0); opacity: 0; }
      45%       { transform: translate(22px, 0); opacity: 1; }
      48%, 50%  { transform: translate(45px, 0); opacity: 1; }
      52%       { transform: translate(18px, 0); opacity: 1; }
      55%, 100% { transform: translate(0, 0); opacity: 0; }
    }

    /* Mouth opens briefly when chomping */
    .mouth {
      animation: mouth 4s infinite steps(1);
    }
    @keyframes mouth {
      0%, 49%   { transform: scaleY(1); }
      50%, 53%  { transform: scaleY(2); }
      54%, 100% { transform: scaleY(1); }
    }
  </style>

  <!-- background -->
  <rect width="400" height="100" fill="#9bbc0f"/>

  <!-- ground -->
  <g fill="#306230"><rect x="0" y="84" width="400" height="4"/></g>
